# staticcheck configuration.
#
# checks defaults to ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020",
# "-ST1021", "-ST1022", "-ST1023"]. This keeps that and removes one more.
#
# ST1005 — "error strings should not be capitalized" — is a good rule with a
# heuristic that cannot see proper nouns. Every occurrence in this codebase is
# one: "Vault has no auth method mounted at…", "Slack rejected the webhook…",
# "Entra ID would not issue a token…", "Key Vault needs the certificate body…".
# Lowercasing them to satisfy the check would make the messages wrong, and
# nine per-line ignore directives would make them unreadable.
#
# The underlying reason for ST1005 — that errors get wrapped and read
# mid-sentence — still applies, so a message starting with an ordinary word
# should still start lowercase.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023", "-ST1005"]
