# CertPilot, as four containers and a database.
#
# The database is not here on purpose. CertPilot stores certificate private
# keys and CA credentials; running its store as an ephemeral container beside
# the app is how an evaluation becomes a deployment nobody meant to make. Point
# CERTPILOT_DB_URL at a database somebody is backing up.
#
#   cp deploy/compose.env.example deploy/.env      # then edit it
#   make dev-certs                                 # mTLS for the gateway channel
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#
# Migrations are not applied on startup — see the `migrate` profile at the
# bottom. A schema change should be something an operator runs, not a side
# effect of a replica restarting.
services:
  core:
    build:
      context: ..
      dockerfile: deploy/docker/core.Dockerfile
    container_name: certpilot-core
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Without this the core refuses to start against a database, which is
      # the intended behaviour: every stored private key is encrypted with it.
      CERTPILOT_KEK: ${CERTPILOT_KEK:?set CERTPILOT_KEK — generate one with: make generate-kek}
      CERTPILOT_KEK_RETIRED: ${CERTPILOT_KEK_RETIRED:-}
      CERTPILOT_DB_URL: ${CERTPILOT_DB_URL:?set CERTPILOT_DB_URL}
      CERTPILOT_JWKS_URL: ${CERTPILOT_JWKS_URL:-}
      CERTPILOT_JWT_ISSUER: ${CERTPILOT_JWT_ISSUER:-}
    volumes:
      # The configuration is a file rather than environment variables because
      # it describes gateways, origins and intervals — a shape environment
      # variables express badly.
      - ${CERTPILOT_CONFIG:-./config.production.yaml}:/app/config.yaml:ro
      # The core's client identity for the gateway channel.
      - ../.certpilot/pki:/app/pki:ro
    command: ["--config=/app/config.yaml"]
    depends_on:
      - gateway-acme
      - gateway-vault
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  gateway-acme:
    build:
      context: ..
      dockerfile: deploy/docker/gateway-acme.Dockerfile
    container_name: certpilot-gateway-acme
    restart: unless-stopped
    volumes:
      - ../.certpilot/pki:/app/pki:ro
      # ACME account keys must survive a restart, or every restart registers a
      # new account with the CA.
      - acme-state:/app/state
    command:
      - "--port=9092"
      - "--directory=letsencrypt-staging"
      - "--state-dir=/app/state"
      - "--tls-cert=/app/pki/gateway.pem"
      - "--tls-key=/app/pki/gateway-key.pem"
      - "--tls-ca=/app/pki/ca.pem"
    # Port 80 is only needed for http-01. Uncomment for that challenge type;
    # dns-01 needs nothing published.
    # ports:
    #   - "80:80"

  gateway-vault:
    build:
      context: ..
      dockerfile: deploy/docker/gateway-vault.Dockerfile
    container_name: certpilot-gateway-vault
    restart: unless-stopped
    volumes:
      - ../.certpilot/pki:/app/pki:ro
    environment:
      # A default for accounts that do not name a Vault, and the only address
      # HealthCheck can probe. No VAULT_TOKEN: each CA account carries its own
      # identity, so this process is authorised to sign nothing.
      VAULT_ADDR: ${VAULT_ADDR:-}
      VAULT_NAMESPACE: ${VAULT_NAMESPACE:-}
    command:
      - "--port=9093"
      - "--tls-cert=/app/pki/gateway.pem"
      - "--tls-key=/app/pki/gateway-key.pem"
      - "--tls-ca=/app/pki/ca.pem"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/docker/frontend.Dockerfile
    container_name: certpilot-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - core

  # Migrations, as a job rather than a service.
  #
  #   docker compose -f deploy/docker-compose.yml --profile migrate run --rm migrate
  migrate:
    profiles: ["migrate"]
    build:
      context: ..
      dockerfile: deploy/docker/core.Dockerfile
    environment:
      CERTPILOT_DB_URL: ${CERTPILOT_DB_URL:?set CERTPILOT_DB_URL}
    command: ["--migrate", "--migrations=/app/migrations"]

volumes:
  acme-state:
