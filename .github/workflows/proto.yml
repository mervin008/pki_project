name: Protobuf

# pkg/pb is generated and committed. Committing it is what makes a fresh clone
# buildable — core and all three gateways import it, and `buf generate` reaches
# buf.build for its plugins, so a clone with no network and no buf could not
# produce it. The cost of committing generated code is that it can drift from
# the .proto files that produced it, silently, and this job is the thing that
# stops that. Same arrangement as routes.yml, for the same reason.
on:
  pull_request:
    paths:
      - 'proto/**'
      - 'pkg/pb/**'
      - 'buf.yaml'
      - 'buf.gen.yaml'
      - '.github/workflows/proto.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    name: generated protobuf is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Regenerate
        run: buf generate

      - name: Fail if it changed
        run: |
          if ! git diff --quiet -- pkg/pb; then
            echo "::error::pkg/pb is out of date. Run: make proto"
            git --no-pager diff -- pkg/pb
            exit 1
          fi
          echo "Generated protobuf code matches proto/."
