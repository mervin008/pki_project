<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="CertPilot">
  <title>CertPilot</title>
  <!--
    An artificial horizon.

    The instrument a pilot reads to know which way is up is called an
    artificial horizon, and the chart this product is built around is called
    the expiry horizon. Same word, arrived at independently, so the mark can be
    literal rather than being another glowing shield.

    The horizon sits below centre because the near half of the chart is the
    half that matters. The single red mark is an authority close to expiry —
    the only warm colour in the mark, which is the rule the console follows:
    colour means severity and nothing else.

    Everything is sized so the circle, the horizon and the one mark survive at
    16px. The graduations are the first thing to go and are meant to.
  -->
  <defs>
    <clipPath id="bezel"><circle cx="32" cy="32" r="25"/></clipPath>
  </defs>

  <g clip-path="url(#bezel)">
    <!-- Ground: time already spent -->
    <rect x="0" y="37" width="64" height="27" fill="#0a7ea4" opacity="0.18"/>
    <!-- Graduations, closing up towards now the way a logarithmic axis does -->
    <g stroke="#0a7ea4" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
      <path d="M25 37 V32.5"/>
      <path d="M35 37 V32.5"/>
      <path d="M46 37 V32.5"/>
    </g>
    <!-- The axis -->
    <path d="M4 37 H60" stroke="#0a7ea4" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- Bezel -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#0a7ea4" stroke-width="3.4"/>

  <!-- One authority, close in, critical -->
  <path d="M20 37.5 V25" stroke="#d93025" stroke-width="2.8" stroke-linecap="round"/>
  <circle cx="20" cy="23" r="3.6" fill="#d93025"/>
</svg>
